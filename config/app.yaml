serial_port: "/dev/ttyUSB0"
baud_rate: 115200
window_width: 1920
window_height: 1080
fullscreen: true
use_kms: true

assets_dir: "assets"
font_path: "assets/fonts/DejaVuSans.ttf"

db_path: "data/leaderboard.db"
video_dir: "data/videos"
camera_duration_ms: 3000
camera_command: "ffmpeg -y -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 30 -t 3 -i /dev/video0 -c:v libx264 -preset ultrafast {output}"

server_url: ""
auth_token: ""
sync_enabled: true
leaderboard_size: 10

# Tryby gry: id:nazwa:mnoznik, oddzielone przecinkami
game_modes: "boxer:BOXER:1.0, kopacz:KOPACZ:1.1"

# Audio (opcjonalne; puste = brak dzwieku). Pliki .wav / .ogg w assets/sfx/
sound_coin: ""
sound_hit: ""
sound_select: ""
sound_win: ""
music_attract: ""
