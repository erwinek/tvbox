# TVBox kiosk — Sway/wlroots (rotacja HW przez i915, bez SDL RenderCopyEx)
output * {
    bg #000000 solid_color
    # Full HD landscape + transform 90 => logiczne 1080x1920 (mniej CPU niz 4K).
    mode 1920x1080@60Hz
    # Monitor zamontowany pionowo; 90 = CW (odwrotnosc 270).
    transform 90
}

seat * {
    hide_cursor when-typing enable
}

default_border none
default_floating_border none
font pango:DejaVu Sans Mono 1
focus_follows_mouse no
workspace_layout tabbed

# Start apki; po wyjsciu zamknij sway (systemd Restart=).
exec /home/boxer/tvbox/bin/tvbox-kiosk-run.sh
