# Produkcja: Dell Wyse — Sway kiosk (FHD) + transform 90
# DRM atomic rotate dziala (drm_rotate_probe / TVBOX_DRM_ATOMIC=1), ale SDL software
# present jest wolniejszy niz Sway — domyslnie Sway.
serial_port: "/dev/ttyUSB0"
baud_rate: 115200
window_width: 1080
window_height: 1920
display_width: 1920
display_height: 1080
fullscreen: true
use_kms: false
display_rotate: 0
layout_scale: auto

assets_dir: "assets"
font_path: "assets/fonts/DejaVuSans.ttf"
font_path_heading: ""

db_path: "data/leaderboard.db"
video_dir: "data/videos"
background_dir: "assets/backgrounds"
camera_duration_ms: 3000
camera_post_hit_ms: 0
camera_command: "ffmpeg -y -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 30 -i {camera} -c:v libx264 -preset ultrafast -tune zerolatency -g 15 -keyint_min 15 -f mpegts pipe:1"

server_url: ""
auth_token: ""
sync_enabled: true
leaderboard_size: 30

game_modes: "boxer:BOXER:1.0, kopacz:KOPACZ:1.1"

sound_coin: ""
sound_hit: ""
sound_select: ""
sound_win: ""
music_attract: ""
